<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solana Transactions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              solanaPurple: { DEFAULT: "#9945FF" },
              solanaBlue: { DEFAULT: "#14F195" },
            },
          },
        },
      };
    </script>
    <style>
      :root { color-scheme: dark; }
      body { color: #e5e7eb; }
      .card {
        background-color: rgba(255,255,255,0.05);
        backdrop-filter: blur(6px);
        border-radius: 0.75rem;
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3), 0 4px 6px -4px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-800 to-blue-700">
    <div id="app"></div>

    <script type="module">
      import React, { useCallback, useMemo, useState } from "https://esm.sh/react@18.3.1";
      import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
      import { Connection, PublicKey } from "https://esm.sh/@solana/web3.js@1.95.4";

      const SOLSCAN_BASE = "https://solscan.io/tx/";

      function clusterFromRpcUrl(url) {
        const u = url.toLowerCase();
        if (u.includes("devnet")) return "devnet";
        if (u.includes("testnet")) return "testnet";
        if (u.includes("mainnet")) return "mainnet";
        return undefined;
      }

      async function getLastTransactions(rpcUrl, address, max) {
        const connection = new Connection(rpcUrl, "confirmed");
        const pubkey = new PublicKey(address);
        const signatures = await connection.getSignaturesForAddress(pubkey, { limit: max });
        return signatures.map((s) => ({
          signature: s.signature,
          timestamp: s.blockTime ?? null,
        }));
      }

      function shortSignature(sig, n = 6) {
        return sig.length > 16 ? `${sig.slice(0, n)}...${sig.slice(-n)}` : sig;
      }

      function App() {
        const [rpcUrl, setRpcUrl] = useState("");
        const [address, setAddress] = useState("");
        const [status, setStatus] = useState("idle"); // idle | loading | error | success
        const [error, setError] = useState(null);
        const [rows, setRows] = useState([]);

        const isValidUrl = useMemo(() => {
          try {
            const u = new URL(rpcUrl);
            return ["http:", "https:"].includes(u.protocol);
          } catch {
            return false;
          }
        }, [rpcUrl]);

        const isValidAddress = useMemo(() => {
          try {
            new PublicKey(address);
            return true;
          } catch {
            return false;
          }
        }, [address]);

        const disabled = !isValidUrl || !isValidAddress || status === "loading";

        const onFetch = useCallback(async () => {
          setStatus("loading");
          setError(null);
          setRows([]);
          try {
            const data = await getLastTransactions(rpcUrl.trim(), address.trim(), 10);
            setRows(data);
            setStatus("success");
          } catch (e) {
            setError(e?.message || "Failed to fetch transactions");
            setStatus("error");
          }
        }, [rpcUrl, address]);

        const cluster = useMemo(() => clusterFromRpcUrl(rpcUrl), [rpcUrl]);

        return React.createElement(
          "div",
          { className: "min-h-screen px-4 py-8" },
          React.createElement(
            "div",
            { className: "max-w-5xl mx-auto space-y-6" },
            React.createElement(
              "header",
              { className: "text-center" },
              React.createElement(
                "h1",
                { className: "text-3xl md:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-solanaPurple to-solanaBlue" },
                "Last 10 Transactions"
              ),
              React.createElement(
                "p",
                { className: "mt-2 text-sm text-gray-300" },
                "Enter an RPC URL and a wallet address to view the last 10 transactions."
              )
            ),
            React.createElement(
              "section",
              { className: "card p-4 md:p-6" },
              React.createElement(
                "div",
                { className: "grid grid-cols-1 md:grid-cols-2 gap-4" },
                React.createElement(
                  "div",
                  null,
                  React.createElement(
                    "label",
                    { className: "block text-sm font-medium text-gray-300 mb-1" },
                    "Solana RPC URL"
                  ),
                  React.createElement("input", {
                    type: "url",
                    placeholder: "https://api.mainnet-beta.solana.com",
                    value: rpcUrl,
                    onChange: (e) => setRpcUrl(e.target.value),
                    className:
                      "w-full rounded-lg bg-white/10 border border-white/20 px-3 py-2 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-solanaPurple",
                  }),
                  !isValidUrl &&
                    rpcUrl.length > 0 &&
                    React.createElement(
                      "p",
                      { className: "mt-1 text-xs text-red-300" },
                      "Enter a valid HTTP(s) RPC URL."
                    )
                ),
                React.createElement(
                  "div",
                  null,
                  React.createElement(
                    "label",
                    { className: "block text-sm font-medium text-gray-300 mb-1" },
                    "Wallet Address"
                  ),
                  React.createElement("input", {
                    type: "text",
                    placeholder: "Enter a public key (base58)",
                    value: address,
                    onChange: (e) => setAddress(e.target.value),
                    className:
                      "w-full rounded-lg bg-white/10 border border-white/20 px-3 py-2 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-solanaPurple",
                  }),
                  !isValidAddress &&
                    address.length > 0 &&
                    React.createElement(
                      "p",
                      { className: "mt-1 text-xs text-red-300" },
                      "Enter a valid Solana address."
                    )
                )
              ),
              React.createElement(
                "div",
                { className: "mt-4 flex items-center gap-3" },
                React.createElement(
                  "button",
                  {
                    onClick: onFetch,
                    disabled: disabled,
                    className:
                      "rounded-lg px-4 py-2 font-semibold text-white transition " +
                      (disabled
                        ? "bg-gray-600 cursor-not-allowed"
                        : "bg-gradient-to-r from-solanaPurple to-solanaBlue hover:opacity-90"),
                  },
                  status === "loading" ? "Fetching..." : "Fetch Transactions"
                ),
                status === "error" &&
                  error &&
                  React.createElement("span", { className: "text-red-300 text-sm" }, error),
                status === "success" &&
                  rows.length === 0 &&
                  React.createElement("span", { className: "text-gray-300 text-sm" }, "No transactions found.")
              )
            ),
            React.createElement(
              "section",
              { className: "card p-4 md:p-6 overflow-x-auto" },
              React.createElement(
                "table",
                { className: "min-w-full text-sm" },
                React.createElement(
                  "thead",
                  null,
                  React.createElement(
                    "tr",
                    { className: "text-left text-gray-300" },
                    React.createElement("th", { className: "py-2 pr-4" }, "Signature"),
                    React.createElement("th", { className: "py-2 pr-4" }, "Timestamp")
                  )
                ),
                React.createElement(
                  "tbody",
                  null,
                  rows.map((r, idx) => {
                    const cluster = clusterFromRpcUrl(rpcUrl);
                    const solscanUrl =
                      SOLSCAN_BASE +
                      r.signature +
                      (cluster ? `?cluster=${cluster === "mainnet" ? "mainnet" : cluster}` : "");
                    return React.createElement(
                      "tr",
                      { key: r.signature + idx, className: "border-t border-white/10" },
                      React.createElement(
                        "td",
                        { className: "py-2 pr-4" },
                        React.createElement(
                          "a",
                          { href: solscanUrl, target: "_blank", rel: "noreferrer", className: "text-solanaBlue hover:underline", title: r.signature },
                          shortSignature(r.signature)
                        )
                      ),
                      React.createElement(
                        "td",
                        { className: "py-2 pr-4" },
                        r.timestamp ? new Date(r.timestamp * 1000).toLocaleString() : "-"
                      )
                    );
                  })
                )
              )
            ),
            React.createElement(
              "footer",
              { className: "text-center text-xs text-white/70" },
              "Powered by Solana RPC."
            )
          )
        );
      }

      const root = createRoot(document.getElementById("app"));
      root.render(React.createElement(App));
    </script>
  </body>
</html>
