<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solana Token Transfers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              solanaPurple: { DEFAULT: "#9945FF" },
              solanaBlue: { DEFAULT: "#14F195" },
            },
          },
        },
      };
    </script>
    <style>
      :root { color-scheme: dark; }
      body { color: #e5e7eb; }
      .card {
        background-color: rgba(255,255,255,0.05);
        backdrop-filter: blur(6px);
        border-radius: 0.75rem;
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3), 0 4px 6px -4px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-800 to-blue-700">
    <div id="app"></div>

    <script type="module">
      import React, { useCallback, useMemo, useState } from "https://esm.sh/react@18.3.1";
      import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
      import { Connection, PublicKey } from "https://esm.sh/@solana/web3.js@1.95.4";

      const SOLSCAN_BASE = "https://solscan.io/tx/";
      const TOKEN_PROGRAM_ID = new PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA");

      function clusterFromRpcUrl(url) {
        const u = url.toLowerCase();
        if (u.includes("devnet")) return "devnet";
        if (u.includes("testnet")) return "testnet";
        if (u.includes("mainnet")) return "mainnet";
        return undefined;
      }

      async function fetchTokenList() {
        try {
          const res = await fetch(
            "https://raw.githubusercontent.com/solana-labs/token-list/main/src/tokens/solana.tokenlist.json"
          );
          const data = await res.json();
          const map = {};
          for (const t of data.tokens || []) {
            map[t.address] = { symbol: t.symbol, name: t.name };
          }
          return map;
        } catch {
          return {};
        }
      }

      async function getOwnedTokenAccounts(connection, owner) {
        try {
          const resp = await connection.getTokenAccountsByOwner(owner, { programId: TOKEN_PROGRAM_ID });
          const set = new Set();
          for (const acc of resp.value) {
            set.add(acc.pubkey.toBase58());
          }
          return set;
        } catch {
          return new Set();
        }
      }

      function collectParsedInstructions(tx) {
        const out = [];
        const top = (tx.transaction?.message?.instructions ?? []);
        for (const ix of top) out.push(ix);
        const inner = tx.meta?.innerInstructions ?? [];
        for (const group of inner) {
          for (const ix of (group.instructions ?? [])) {
            out.push(ix);
          }
        }
        return out;
      }

      async function getTransfersForAddress(rpcUrl, address, max) {
        const connection = new Connection(rpcUrl, "confirmed");
        const wallet = new PublicKey(address);

        // Resolve token accounts owned by the wallet
        const ownedTokenAccounts = await getOwnedTokenAccounts(connection, wallet);

        const signatures = await connection.getSignaturesForAddress(wallet, { limit: 100 });
        const out = [];
        const tokenList = await fetchTokenList();

        for (const sigInfo of signatures) {
          if (out.length >= max) break;
          try {
            const tx = await connection.getParsedTransaction(sigInfo.signature, {
              maxSupportedTransactionVersion: 0,
            });
            if (!tx) continue;

            const blockTime = tx.blockTime ?? null;
            const signature = sigInfo.signature;

            const instructions = collectParsedInstructions(tx);

            for (const ix of instructions) {
              const parsed = ix?.parsed;
              const type = parsed?.type;
              const program = ix?.program;
              const info = parsed?.info || {};

              // SPL token transfers
              if ((program === "spl-token" || info.mint) && (type === "transferChecked" || type === "transfer")) {
                const source = info.source || null;
                const destination = info.destination || null;
                const mint = info.mint || null;
                const decimals = typeof info.decimals === "number" ? info.decimals : null;
                const rawAmountStr = info.tokenAmount?.amount ?? info.amount ?? null;

                const related =
                  (source && ownedTokenAccounts.has(source)) ||
                  (destination && ownedTokenAccounts.has(destination));
                if (!related) continue;

                let amount = null;
                if (rawAmountStr !== null) {
                  const n = Number(rawAmountStr);
                  if (Number.isFinite(n)) {
                    amount = decimals != null ? n / 10 ** decimals : n;
                  }
                }

                const meta = mint ? tokenList[mint] : undefined;

                out.push({
                  signature,
                  timestamp: blockTime,
                  mint,
                  symbol: meta?.symbol ?? null,
                  name: meta?.name ?? null,
                  amount,
                  decimals,
                  from: source,
                  to: destination,
                });

                if (out.length >= max) break;
              }

              // Native SOL transfers
              if (ix?.program === "system" && type === "transfer") {
                const source = info.source || null;
                const destination = info.destination || null;
                const lamports = typeof info.lamports === "number" ? info.lamports : null;

                const related = source === address || destination === address;
                if (!related) continue;

                const amountSol = lamports != null ? lamports / 1e9 : null;

                out.push({
                  signature,
                  timestamp: blockTime,
                  mint: null,
                  symbol: "SOL",
                  name: "Solana",
                  amount: amountSol,
                  decimals: 9,
                  from: source,
                  to: destination,
                });

                if (out.length >= max) break;
              }
            }
          } catch {
            // ignore
          }
        }

        return out.slice(0, max);
      }

      function shortAddress(addr, n = 4) {
        return addr.length > 10 ? `${addr.slice(0, 4)}...${addr.slice(-4)}` : addr;
      }
      function shortSignature(sig, n = 6) {
        return sig.length > 16 ? `${sig.slice(0, n)}...${sig.slice(-n)}` : sig;
      }

      function App() {
        const [rpcUrl, setRpcUrl] = useState("");
        const [address, setAddress] = useState("");
        const [status, setStatus] = useState("idle"); // idle | loading | error | success
        const [error, setError] = useState(null);
        const [rows, setRows] = useState([]);

        const isValidUrl = useMemo(() => {
          try {
            const u = new URL(rpcUrl);
            return ["http:", "https:"].includes(u.protocol);
          } catch {
            return false;
          }
        }, [rpcUrl]);

        const isValidAddress = useMemo(() => {
          try {
            new PublicKey(address);
            return true;
          } catch {
            return false;
          }
        }, [address]);

        const disabled = !isValidUrl || !isValidAddress || status === "loading";

        const onFetch = useCallback(async () => {
          setStatus("loading");
          setError(null);
          setRows([]);
          try {
            const data = await getTransfersForAddress(rpcUrl.trim(), address.trim(), 10);
            setRows(data);
            setStatus("success");
          } catch (e) {
            setError(e?.message || "Failed to fetch transfers");
            setStatus("error");
          }
        }, [rpcUrl, address]);

        const cluster = useMemo(() => clusterFromRpcUrl(rpcUrl), [rpcUrl]);

        return React.createElement(
          "div",
          { className: "min-h-screen px-4 py-8" },
          React.createElement(
            "div",
            { className: "max-w-5xl mx-auto space-y-6" },
            React.createElement(
              "header",
              { className: "text-center" },
              React.createElement(
                "h1",
                { className: "text-3xl md:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-solanaPurple to-solanaBlue" },
                "Solana Token Transfers Viewer"
              ),
              React.createElement(
                "p",
                { className: "mt-2 text-sm text-gray-300" },
                "Enter an RPC URL and a wallet address to view the last 10 transfers (SOL and SPL tokens)."
              )
            ),
            React.createElement(
              "section",
              { className: "card p-4 md:p-6" },
              React.createElement(
                "div",
                { className: "grid grid-cols-1 md:grid-cols-2 gap-4" },
                React.createElement(
                  "div",
                  null,
                  React.createElement(
                    "label",
                    { className: "block text-sm font-medium text-gray-300 mb-1" },
                    "Solana RPC URL"
                  ),
                  React.createElement("input", {
                    type: "url",
                    placeholder: "https://api.mainnet-beta.solana.com",
                    value: rpcUrl,
                    onChange: (e) => setRpcUrl(e.target.value),
                    className:
                      "w-full rounded-lg bg-white/10 border border-white/20 px-3 py-2 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-solanaPurple",
                  }),
                  !isValidUrl &&
                    rpcUrl.length > 0 &&
                    React.createElement(
                      "p",
                      { className: "mt-1 text-xs text-red-300" },
                      "Enter a valid HTTP(s) RPC URL."
                    )
                ),
                React.createElement(
                  "div",
                  null,
                  React.createElement(
                    "label",
                    { className: "block text-sm font-medium text-gray-300 mb-1" },
                    "Wallet Address"
                  ),
                  React.createElement("input", {
                    type: "text",
                    placeholder: "Enter a public key (base58)",
                    value: address,
                    onChange: (e) => setAddress(e.target.value),
                    className:
                      "w-full rounded-lg bg-white/10 border border-white/20 px-3 py-2 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-solanaPurple",
                  }),
                  !isValidAddress &&
                    address.length > 0 &&
                    React.createElement(
                      "p",
                      { className: "mt-1 text-xs text-red-300" },
                      "Enter a valid Solana address."
                    )
                )
              ),
              React.createElement(
                "div",
                { className: "mt-4 flex items-center gap-3" },
                React.createElement(
                  "button",
                  {
                    onClick: onFetch,
                    disabled: disabled,
                    className:
                      "rounded-lg px-4 py-2 font-semibold text-white transition " +
                      (disabled
                        ? "bg-gray-600 cursor-not-allowed"
                        : "bg-gradient-to-r from-solanaPurple to-solanaBlue hover:opacity-90"),
                  },
                  status === "loading" ? "Fetching..." : "Fetch Transfers"
                ),
                status === "error" &&
                  error &&
                  React.createElement("span", { className: "text-red-300 text-sm" }, error),
                status === "success" &&
                  rows.length === 0 &&
                  React.createElement("span", { className: "text-gray-300 text-sm" }, "No transfers found.")
              )
            ),
            React.createElement(
              "section",
              { className: "card p-4 md:p-6 overflow-x-auto" },
              React.createElement(
                "table",
                { className: "min-w-full text-sm" },
                React.createElement(
                  "thead",
                  null,
                  React.createElement(
                    "tr",
                    { className: "text-left text-gray-300" },
                    React.createElement("th", { className: "py-2 pr-4" }, "Token"),
                    React.createElement("th", { className: "py-2 pr-4" }, "Symbol"),
                    React.createElement("th", { className: "py-2 pr-4" }, "Amount"),
                    React.createElement("th", { className: "py-2 pr-4" }, "From"),
                    React.createElement("th", { className: "py-2 pr-4" }, "To"),
                    React.createElement("th", { className: "py-2 pr-4" }, "Signature"),
                    React.createElement("th", { className: "py-2 pr-4" }, "Timestamp")
                  )
                ),
                React.createElement(
                  "tbody",
                  null,
                  rows.map((r, idx) => {
                    const cluster = clusterFromRpcUrl(rpcUrl);
                    const solscanUrl =
                      SOLSCAN_BASE +
                      r.signature +
                      (cluster ? `?cluster=${cluster === "mainnet" ? "mainnet" : cluster}` : "");
                    return React.createElement(
                      "tr",
                      { key: r.signature + idx, className: "border-t border-white/10" },
                      React.createElement("td", { className: "py-2 pr-4" }, r.name ?? r.mint ?? "-"),
                      React.createElement("td", { className: "py-2 pr-4" }, r.symbol ?? "-"),
                      React.createElement(
                        "td",
                        { className: "py-2 pr-4" },
                        r.amount != null
                          ? r.amount.toLocaleString(undefined, {
                              maximumFractionDigits: r.decimals != null ? Math.min(r.decimals, 9) : 9,
                            })
                          : "-"
                      ),
                      React.createElement(
                        "td",
                        { className: "py-2 pr-4" },
                        r.from ? React.createElement("span", { title: r.from }, shortAddress(r.from)) : "-"
                      ),
                      React.createElement(
                        "td",
                        { className: "py-2 pr-4" },
                        r.to ? React.createElement("span", { title: r.to }, shortAddress(r.to)) : "-"
                      ),
                      React.createElement(
                        "td",
                        { className: "py-2 pr-4" },
                        React.createElement(
                          "a",
                          { href: solscanUrl, target: "_blank", rel: "noreferrer", className: "text-solanaBlue hover:underline", title: r.signature },
                          shortSignature(r.signature)
                        )
                      ),
                      React.createElement(
                        "td",
                        { className: "py-2 pr-4" },
                        r.timestamp ? new Date(r.timestamp * 1000).toLocaleString() : "-"
                      )
                    );
                  })
                )
              )
            ),
            React.createElement(
              "footer",
              { className: "text-center text-xs text-white/70" },
              "Powered by Solana RPC. Includes SOL and SPL token transfers, matched to your wallet."
            )
          )
        );
      }

      const root = createRoot(document.getElementById("app"));
      root.render(React.createElement(App));
    </script>
  </body>
</html>
